name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64   # default generator = the Visual Studio installed on the runner

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4 --target Jukebox_VST3

      - name: Build VST3 + AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4 --target Jukebox_VST3 Jukebox_AU

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Jukebox_artefacts/Release/VST3/JUKEBOX.vst3 -DestinationPath dist/JUKEBOX-Windows-VST3.zip

      - name: Package (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cd build/Jukebox_artefacts/Release
          for b in VST3/JUKEBOX.vst3/Contents/MacOS/JUKEBOX AU/JUKEBOX.component/Contents/MacOS/JUKEBOX; do
            lipo -info "$b"
            lipo "$b" -verify_arch arm64 x86_64   # fail unless universal (Apple Silicon + Intel)
          done
          codesign --force --deep --sign - VST3/JUKEBOX.vst3
          codesign --force --deep --sign - AU/JUKEBOX.component
          ditto -c -k --keepParent VST3/JUKEBOX.vst3 "$GITHUB_WORKSPACE/dist/JUKEBOX-macOS-VST3.zip"
          ditto -c -k --keepParent AU/JUKEBOX.component "$GITHUB_WORKSPACE/dist/JUKEBOX-macOS-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: JUKEBOX-${{ matrix.name }}
          path: dist/*.zip

  test:
    name: Tests (audio + state + UI screenshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUKEBOX_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --parallel 4 --target Jukebox_VST3 JukeboxPluginTest JukeboxRenderTest JukeboxHostTest
      - name: Run plugin test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" build/JukeboxPluginTest_artefacts/Release/JukeboxPluginTest test-output
      - name: Load the VST3 bundle in a host
        run: xvfb-run -a -s "-screen 0 1600x1000x24" build/JukeboxHostTest_artefacts/Release/JukeboxHostTest build/Jukebox_artefacts/Release/VST3/JUKEBOX.vst3
      - name: Run render test
        run: build/JukeboxRenderTest_artefacts/Release/JukeboxRenderTest test-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: JUKEBOX-*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
