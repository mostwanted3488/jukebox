  button { font-family: 'Minecraft', monospace; font-size: 16px; letter-spacing: 0; color: #e6e0d4; background: #2c2824;
    border: 3px solid #121110; box-shadow: inset -3px -3px 0 #1c1916, inset 3px 3px 0 #3f3831; padding: 5px 10px; cursor: pointer; }
  button:active, button.on { box-shadow: inset 3px 3px 0 #1c1916, inset -3px -3px 0 #3f3831; }
  button.on { color: var(--tint); }

  /* ---------- left: jukebox + shelf ---------- */
  #left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vh; min-height: 0; }
  header { text-align: center; line-height: 1; }
  h1 { font-family: 'Minecraft', monospace; font-weight: 400; font-size: 32px; letter-spacing: 4px; margin: 0; color: #efe9dc; }
  .hint { font-size: 16px; color: #8f8c86; margin-top: 6px; }
  #stage { position: relative; width: min(34vh, 26vw, 330px); min-width: 210px; aspect-ratio: 1; margin-top: 3vh; }
  #stage { margin-bottom: 9vh; }
  #redstone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
  #jw { z-index: 2; }
  #lever { pointer-events: auto; cursor: pointer; }
  #lever:hover #leverBase { filter: brightness(1.2); }
  #handle { transition: transform .12s steps(3); }
  #dust rect { fill: #4d0a06; } #dust rect.h { fill: #6b120c; } #dust rect.d { fill: #330604; }
  #redstone.on #dust rect { fill: #9e140c; } #redstone.on #dust rect.h { fill: #c41b10; } #redstone.on #dust rect.d { fill: #6e0d08; }
  #redstone.on.lit #dust rect { fill: #ff2a1a; } #redstone.on.lit #dust rect.h { fill: #ff8566; } #redstone.on.lit #dust rect.d { fill: #c4130c; }
  #sparks rect { fill: #ff4a2e; opacity: 0; }
  #redstone.on.lit #sparks rect.s { opacity: 1; }
  #envCard { gap: 22px; }
  .val { font-size: 16px; color: var(--tint); min-width: 60px; text-align: center; transition: color .8s; }
  .redbox .title span { color: #6e1a12; }
  .redbox.on .title span { color: #ff3b22; }
  .hintline { font-size: 16px; color: #6f6b65; margin-top: 4px; }
  #glow { position: absolute; inset: -20%; --a: 1; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 1s, background 1s;
    background: radial-gradient(circle, color-mix(in srgb, var(--tint) 45%, transparent) 0%, transparent 62%); }
  body.loaded #glow { opacity: .6; }
  #jw { position: absolute; inset: 0; transform-origin: 50% 90%; }
  #juke { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  #jw.bump { animation: bump .22s ease-out; }
  @keyframes bump { 0% { transform: scale(1.035, .975); } 100% { transform: scale(1,1); } }
  #jw.nope { animation: nope .35s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #stage.over #juke { filter: brightness(1.18) drop-shadow(0 0 14px color-mix(in srgb, var(--tint) 80%, white)); }
  /* pixel-exact light: only the slot's own pixels + a thin crisp rim on the wood */
  #slotglow, #rimglow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }

  body.loaded #slotglow { opacity: .75; animation: slotpulse 2.4s steps(6) infinite; }
  body.loaded #rimglow { opacity: .22; animation: rimpulse 2.4s steps(6) infinite; }
  @keyframes slotpulse { 50% { opacity: 1; } }
  @keyframes rimpulse { 50% { opacity: .38; } }
  .note { position: fixed; width: 20px; height: 20px; pointer-events: none; z-index: 30; }

  #shelf { display: grid; grid-template-columns: repeat(5, auto); gap: 6px min(2vw, 16px); padding: 12px 18px 14px;
    background: #2a2622; border: 4px solid #121110; box-shadow: inset 0 -6px 0 #1d1a17, inset 0 4px 0 #3b352f; }
  .slot { width: min(8vh, 5.4vw, 74px); min-width: 50px; aspect-ratio: 1; position: relative; display: grid; place-items: center; }
  .slot::after { content: ''; position: absolute; inset: 10%; border: 3px dashed #4a443d; opacity: 0; transition: opacity .3s; }
  .slot.empty::after { opacity: 1; }
  .disc { width: 100%; height: 100%; cursor: grab; transition: transform .15s, opacity .2s; animation: bob 3s ease-in-out infinite; }
  .disc:hover { transform: translateY(-5px) scale(1.1); }
  .slot.empty .disc { opacity: 0; pointer-events: none; }
  @keyframes bob { 50% { translate: 0 -3px; } }
  .ghost { position: fixed; pointer-events: none; z-index: 40; filter: drop-shadow(0 6px 0 rgba(0,0,0,.35)); }
  .tip { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); white-space: nowrap; z-index: 5;
    font-family: 'Minecraft', monospace; font-size: 16px; color: #fff; background: #100f12ee; padding: 3px 6px; border: 2px solid #2b1a4a;
    opacity: 0; transition: opacity .15s; pointer-events: none; }
  .slot:hover .tip { opacity: 1; }
  .slot.empty .tip { display: none; }

  /* ---------- right: instrument panel ---------- */
  #panel { display: flex; flex-direction: column; gap: 12px; justify-content: center; min-width: 0; min-height: 0; }
  .card { background: #1a1a1dcc; border: 4px solid #0e0e10; box-shadow: inset 0 3px 0 #2a2a30; padding: 12px 14px; }
  #top { display: flex; align-items: center; gap: 18px; flex-wrap: nowrap; }
  #now { flex: 1; min-width: 0; }
  @media (max-width: 1050px) { #top { flex-wrap: wrap; } }
  #now .t { font-family: 'Minecraft', monospace; font-size: 24px; letter-spacing: 1px; color: var(--tint); transition: color .8s; }
  #now .d { font-size: 16px; margin-top: 4px; color: #8f8c86; }
  .ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: 'Minecraft', monospace; font-size: 16px; letter-spacing: 0; color: #a7a39b; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 96px; height: 12px; background: #0e0e10; border: 3px solid #3b352f; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 18px; background: #c9c2b4; border: 3px solid #121110; box-shadow: inset -3px -3px 0 #8b8477; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 8px; height: 14px; background: #c9c2b4; border: 3px solid #121110; border-radius: 0; cursor: pointer; }
  #eq { display: flex; gap: 3px; height: 26px; align-items: flex-end; }
  #eq i { width: 5px; background: var(--tint); height: 2px; transition: background .8s; }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: 'Minecraft', monospace; font-size: 16px; color: #a7a39b; }
  .bar .sep { flex: 1; }
  .bar input[type=number] { width: 54px; font-family: 'Minecraft', monospace; font-size: 20px; background: #0e0e10; color: #e6e0d4; border: 3px solid #3b352f; padding: 0 4px; }
  .title { font-family: 'Minecraft', monospace; font-size: 16px; letter-spacing: 1px; color: #cfc8ba; }

  #keys { position: relative; height: min(15vh, 130px); min-height: 96px; display: flex; touch-action: none; }
  .wk { flex: 1; background: #e9e4d8; border: 2px solid #0e0e10; border-top: 0; margin-right: -2px; position: relative;
    box-shadow: inset 0 -8px 0 #c9c2b4; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
  .bk { position: absolute; top: 0; height: 60%; background: #1f1d1b; border: 2px solid #0e0e10; z-index: 2; cursor: pointer;
    box-shadow: inset 0 -6px 0 #000, inset 2px 0 0 #3a3632; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .wk.down { background: color-mix(in srgb, var(--tint) 55%, #e9e4d8); box-shadow: inset 0 -3px 0 #c9c2b4; }
  .bk.down { background: color-mix(in srgb, var(--tint) 70%, #1f1d1b); }
  .lbl { font-family: 'Minecraft', monospace; font-size: 16px; color: #6d675d; pointer-events: none; text-align: center; line-height: 1.2; }
  .bk .lbl { color: #8a847a; }
  .lbl b { display: block; font-weight: 400; color: #a19a8e; font-size: 8px; margin-top: 4px; }
  #sig { position: fixed; right: 28px; bottom: 16px; font-size: 16px; color: color-mix(in srgb, var(--tint) 35%, #8f8c86); transition: color .8s; pointer-events: none; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); font-family: 'Minecraft', monospace; font-size: 16px; letter-spacing: 0;
    background: #0e0e10; border: 3px solid var(--tint); padding: 8px 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50; }
  #toast.show { opacity: 1; }
</style>
</head>

    if (document.querySelectorAll('.note').length > 26) return;     // fallback: flat sprite if WebGL is missing
    const el = document.createElement('img'); el.src = noteSVG(d.color); el.className = 'note';
    el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el);
    el.animate([{ transform: 'scale(.4)', opacity: 0 }, { opacity: 1, offset: .15 }, { transform: `translate(${(Math.random() - .5) * 90}px,-140px)`, opacity: 0 }],
      { duration: 1900, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => el.remove();
  });
}
function eqLoop(now) {
  requestAnimationFrame(eqLoop); redFrame(); if (PS1) PS1.frame(now || performance.now()); if (!analyser) return;
  const a = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(a);
  [...eq.children].forEach((b, i) => { const v = a[Math.floor(Math.pow(i / 12, 1.6) * 70) + 1] / 255; b.style.height = Math.max(2, Math.round(v * 13) * 2) + 'px'; });
}

/* ================= SHELF / DISC INSERT ================= */
DISCS.forEach(d => {
  const s = document.createElement('div'); s.className = 'slot'; s.dataset.id = d.id;
  s.innerHTML = `<span class="tip">${d.name}</span><img class="disc" src="${d.img}" alt="${d.name}" draggable="false">`;
  s.querySelector('.disc').style.animationDelay = (-Math.random() * 3) + 's';
  shelf.appendChild(s); d.slot = s;
});
let inserted = null, busy = false;
function slotPoint() { const r = juke.getBoundingClientRect(); return { x: r.left + r.width * .505, y: r.top + r.height * .2, w: r.width }; }
function ghostFrom(img, rect) {
  const g = document.createElement('img'); g.src = img.src; g.className = 'ghost';
  Object.assign(g.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px' });
  document.body.appendChild(g); return g;
}
function insert(d, fromRect) {
  if (busy || inserted === d) return; initAudio(); busy = true;
  const go = () => {
    const img = d.slot.querySelector('.disc'), rect = fromRect || img.getBoundingClientRect();
    d.slot.classList.add('empty');
    const g = ghostFrom(img, rect), p = slotPoint(), size = p.w * .42, sx = size / rect.width;
    const tx = p.x - (rect.left + rect.width / 2), ty = p.y - (rect.top + rect.height / 2);
    g.animate([
      { transform: 'translate(0,0) rotate(0) scale(1)' },
      { transform: `translate(${tx}px,${ty - size * .9}px) rotate(-8deg) scale(${sx})`, offset: .55 },
      { transform: `translate(${tx}px,${ty - size * .35}px) rotate(9deg) scale(${sx},${sx * .22})`, offset: .8 },
      { transform: `translate(${tx}px,${ty}px) rotate(9deg) scale(${sx * .9},${sx * .05})`, opacity: 0 }
    ], { duration: 720, easing: 'cubic-bezier(.4,.1,.3,1)', fill: 'forwards' }).onfinish = () => {
      g.remove(); inserted = d; busy = false;
      document.documentElement.style.setProperty('--tint', d.color); document.body.classList.add('loaded');
      nowT.textContent = '♪ ' + d.name; nowD.textContent = d.desc;
      loadDisc(d.id);
    };
  };
  if (inserted) eject(go); else go();
}
function eject(then) {
  const d = inserted; if (!d) { then && then(); return; }
  busy = true; pendingDisc = null; unloadDisc(); inserted = null; document.body.classList.remove('loaded');
  nowT.textContent = '— NO DISC —'; nowD.textContent = 'the jukebox is waiting';
  const img = d.slot.querySelector('.disc'), rect = img.getBoundingClientRect();
  const g = ghostFrom(img, rect), p = slotPoint(), size = p.w * .42, sx = size / rect.width;
  const tx = p.x - (rect.left + rect.width / 2), ty = p.y - (rect.top + rect.height / 2);
  g.animate([
    { transform: `translate(${tx}px,${ty}px) rotate(9deg) scale(${sx * .9},${sx * .05})`, opacity: 0 },
    { transform: `translate(${tx}px,${ty - size * .5}px) rotate(9deg) scale(${sx},${sx * .25})`, opacity: 1, offset: .25 },
    { transform: `translate(${tx * .5}px,${ty - size * 1.1}px) rotate(-180deg) scale(${sx})`, offset: .55 },
    { transform: 'translate(0,0) rotate(-360deg) scale(1)' }
  ], { duration: 650, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' }).onfinish = () => {
    g.remove(); d.slot.classList.remove('empty'); busy = false;
    if (!then) document.documentElement.style.setProperty('--tint', '#6b6f78');
    then && then();
  };
}
let drag = null;
shelf.addEventListener('pointerdown', e => {
  const s = e.target.closest('.slot'); if (!s || s.classList.contains('empty') || busy) return;
  initAudio();
  const d = DISCS.find(x => x.id === s.dataset.id), img = s.querySelector('.disc'), r = img.getBoundingClientRect();
  drag = { d, img, r, x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, g: null };
  shelf.setPointerCapture(e.pointerId);
});
shelf.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.g && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) { drag.g = ghostFrom(drag.img, drag.r); drag.img.style.opacity = .15; }
  if (drag.g) {
    drag.g.style.left = (e.clientX - drag.ox) + 'px'; drag.g.style.top = (e.clientY - drag.oy) + 'px';
    drag.g.style.transform = `rotate(${(e.clientX - drag.x0) * .05}deg) scale(1.1)`;
    stage.classList.toggle('over', overJuke(e));
  }
});
function overJuke(e) { const r = stage.getBoundingClientRect(), m = r.width * .12;
  return e.clientX > r.left - m && e.clientX < r.right + m && e.clientY > r.top - m && e.clientY < r.bottom + m; }
function endDrag(e) {
  if (!drag) return; const { d, g, img } = drag; drag = null; stage.classList.remove('over');
  if (!g) { insert(d); return; }
  const rect = g.getBoundingClientRect();
  if (overJuke(e)) { g.remove(); img.style.opacity = ''; insert(d, rect); }
  else {
    const r = img.getBoundingClientRect();
    g.animate([{ left: g.style.left, top: g.style.top, transform: g.style.transform }, { left: r.left + 'px', top: r.top + 'px', transform: 'none' }],
      { duration: 260, easing: 'ease-out', fill: 'forwards' }).onfinish = () => { g.remove(); img.style.opacity = ''; };
  }
}
shelf.addEventListener('pointerup', endDrag); shelf.addEventListener('pointercancel', endDrag);
juke.addEventListener('click', () => { if (!busy && inserted) eject(); });

/* ================= LIVE PLAYING (keyboard, on-screen keys, MIDI) ================= */
const held = {};
function noteOn(m, v = .85) {
  initAudio();
  if (!cur) { jw.classList.remove('nope'); void jw.offsetWidth; jw.classList.add('nope'); toast('insert a disc into the jukebox'); return; }
  if (held[m]) held[m].release(ctx.currentTime);
  held[m] = trigger(cur, m, ctx.currentTime, v); setKey(m, true); bumpAt(ctx.currentTime);
}
function noteOff(m) { if (held[m]) { held[m].release(ctx.currentTime); delete held[m]; } setKey(m, false); }
function releaseAll() { Object.keys(held).forEach(m => noteOff(+m)); }
window.addEventListener('blur', releaseAll);

const LOW = ['KeyZ','KeyS','KeyX','KeyD','KeyC','KeyV','KeyG','KeyB','KeyH','KeyN','KeyJ','KeyM','Comma'];
const UP  = ['KeyQ','Digit2','KeyW','Digit3','KeyE','KeyR','Digit5','KeyT','Digit6','KeyY','Digit7','KeyU','KeyI'];
let LABEL = { KeyZ:'W',KeyS:'S',KeyX:'X',KeyD:'D',KeyC:'C',KeyV:'V',KeyG:'G',KeyB:'B',KeyH:'H',KeyN:'N',KeyJ:'J',KeyM:',',Comma:';',
  KeyQ:'A',Digit2:'É',KeyW:'Z',Digit3:'"',KeyE:'E',KeyR:'R',Digit5:'(',KeyT:'T',Digit6:'§',KeyY:'Y',Digit7:'È',KeyU:'U',KeyI:'I' };  // AZERTY by default
try { navigator.keyboard && navigator.keyboard.getLayoutMap().then(map => { [...LOW, ...UP].forEach(c => { const k = map.get(c); if (k) LABEL[c] = k.toUpperCase(); }); buildKeys(); }).catch(() => {}); } catch (e) {}
let base = 48;
const codeToNote = code => { let i = LOW.indexOf(code); if (i >= 0) return base + i; i = UP.indexOf(code); return i >= 0 ? base + 12 + i : null; };
const keyDown = {};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'KeyL' && !e.repeat) { e.preventDefault(); toggleRedstone(); return; }
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); shiftOct(e.code === 'ArrowUp' ? 12 : -12); return; }
  const m = codeToNote(e.code); if (m == null || e.repeat || keyDown[e.code] != null) return;
  e.preventDefault(); keyDown[e.code] = m; noteOn(m);
});
window.addEventListener('keyup', e => { const m = keyDown[e.code]; if (m != null) { delete keyDown[e.code]; noteOff(m); } });

const keysEl = document.getElementById('keys'), octLbl = document.getElementById('octLbl');
const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
const nName = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
function labelFor(m) { const i = m - base; return i < 12 ? LABEL[LOW[i]] : LABEL[UP[i - 12]] || ''; }
function buildKeys() {
  keysEl.innerHTML = ''; const lo = base, hi = base + 24;
  const whites = []; for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const W = 100 / whites.length;
  for (let m = lo; m <= hi; m++) {
    const k = document.createElement('div'); k.dataset.m = m;
    const lab = labelFor(m), cName = m % 12 === 0 ? `<b>${nName(m)}</b>` : '';
    if (isBlack(m)) {
      const wi = whites.filter(w => w < m).length;
      k.className = 'bk'; k.style.left = `calc(${wi * W}% - ${W * .32}%)`; k.style.width = W * .64 + '%';
      k.innerHTML = `<span class="lbl">${lab}</span>`;
    } else { k.className = 'wk'; k.innerHTML = `<span class="lbl">${lab}${cName}</span>`; }
    keysEl.appendChild(k);
  }
  octLbl.textContent = nName(lo) + '–' + nName(hi);
  Object.keys(held).forEach(m => setKey(+m, true));
}
function setKey(m, on) { const k = keysEl.querySelector(`[data-m="${m}"]`); if (k) k.classList.toggle('down', on); }
function shiftOct(d) { const nb = base + d; if (nb < 24 || nb > 84) return; releaseAll(); base = nb; buildKeys(); saveStateSoon(); }
document.getElementById('octDown').onclick = () => shiftOct(-12);
document.getElementById('octUp').onclick = () => shiftOct(12);
let ptrNote = {};
keysEl.addEventListener('pointerdown', e => { const k = e.target.closest('[data-m]'); if (!k) return; keysEl.setPointerCapture(e.pointerId); ptrNote[e.pointerId] = +k.dataset.m; noteOn(+k.dataset.m); });
keysEl.addEventListener('pointermove', e => {  // glissando
  if (ptrNote[e.pointerId] == null) return;
  const k = document.elementFromPoint(e.clientX, e.clientY)?.closest('#keys [data-m]'); if (!k) return;
  const m = +k.dataset.m; if (m !== ptrNote[e.pointerId]) { noteOff(ptrNote[e.pointerId]); ptrNote[e.pointerId] = m; noteOn(m); }
});
const ptrUp = e => { if (ptrNote[e.pointerId] != null) { noteOff(ptrNote[e.pointerId]); delete ptrNote[e.pointerId]; } };
keysEl.addEventListener('pointerup', ptrUp); keysEl.addEventListener('pointercancel', ptrUp);
buildKeys();

document.getElementById('midiBtn').onclick = function () {
  initAudio();
  if (!navigator.requestMIDIAccess) { toast('MIDI not available in this browser'); return; }
  navigator.requestMIDIAccess().then(acc => {
    const hook = () => { let n = 0; acc.inputs.forEach(inp => { n++; inp.onmidimessage = ev => {
      const [st, m, v] = ev.data, c = st & 0xf0;
      if (c === 0x90 && v > 0) noteOn(m, .3 + .7 * v / 127); else if (c === 0x80 || (c === 0x90 && v === 0)) noteOff(m);
    }; }); this.textContent = n ? `MIDI ✓ ${n}` : 'MIDI (none)'; this.classList.toggle('on', !!n); };
    hook(); acc.onstatechange = hook;
  }).catch(() => toast('MIDI access denied here'));
};

/* ================= SAVE / RESTORE (this browser only) ================= */
const STORE = 'jukebox-state-v1'; let saveTO;
function saveState() {
  try { localStorage.setItem(STORE, JSON.stringify({ disc: inserted ? inserted.id : (pendingDisc || null), lever: redOn, rate: rateI,
    vol: +vol.value, space: +space.value, tone: +tone.value, atk: +atk.value, rel: +relK.value, oct: base })); } catch (e) {}
}
function saveStateSoon() { clearTimeout(saveTO); saveTO = setTimeout(saveState, 150); }
(function restore() {
  let s; try { s = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { s = null; }
  if (!s) return;
  [['vol', vol], ['space', space], ['tone', tone], ['atk', atk], ['rel', relK]].forEach(([k, el]) => { if (typeof s[k] === 'number') el.value = s[k]; });
  showEnv();
  if (typeof s.oct === 'number' && s.oct >= 24 && s.oct <= 84) { base = s.oct; buildKeys(); }
  if (typeof s.rate === 'number' && RATES[s.rate]) { rateI = s.rate; document.getElementById('repBtn').textContent = 'REPEATER ' + RATES[rateI].l; }
  if (s.lever) {                                         // visual state now, audio on first interaction
    redOn = true; redSvg.classList.add('on'); redBox.classList.add('on'); document.getElementById('redState').textContent = 'ON';
    const hd = document.getElementById('handle'); hd.setAttribute('transform', `translate(${hd.dataset.cx} ${hd.dataset.cy}) rotate(40)`);
  }
  const d = DISCS.find(x => x.id === s.disc);
  if (d) {                                               // disc already sitting in the jukebox
    inserted = d; pendingDisc = d.id; d.slot.classList.add('empty');
    document.documentElement.style.setProperty('--tint', d.color); document.body.classList.add('loaded');
    nowT.textContent = '♪ ' + d.name; nowD.textContent = d.desc;
  }
})();
eqLoop();
</script>
